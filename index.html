:root{--ink:#5B6B8C;--ink2:#3E4A66;--bg:#ffffff;--paper:#FBF9F4;--mint:#A8D5C8;--mintd:#8CC0B0;--sun:#F3D9A4;--brick:#B23A2A;--ok:#4F8F7B;--bad:#B23A2A;--line:#D9DEE8;--tx:#3E4A66;--mut:#8590A8;--stage:#EFEDE7;
--wob:15px 11px 16px 10px/11px 16px 10px 15px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;position:fixed;inset:0;width:100%;overflow:hidden;background:var(--paper);color:var(--tx);font:15px/1.4 FoxBody,Helvetica,Arial,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx)}
.ic{width:26px;height:26px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper)}
#top,#cTop{background:#fff;color:var(--ink2);display:flex;align-items:center;gap:2px;padding:calc(env(safe-area-inset-top) + 4px) 8px 4px;min-height:42px;flex:0 0 auto;border-bottom:1.8px solid var(--ink)}
#top .ttl,#cTop .ttl{font:400 24px/1 FoxHand,FoxBody,sans-serif;margin:0 6px 0 4px;white-space:nowrap;color:var(--ink2)}
#top .sp,#cTop .sp{flex:1}
.ib{width:36px;height:36px;border-radius:var(--wob);color:var(--ink);display:flex;align-items:center;justify-content:center}
.ib:active,.ib.hold{background:var(--mint)}
.ib[disabled]{opacity:.3}
.sv{background:var(--sun);color:var(--ink2);font-weight:700;border:1.8px solid var(--ink);border-radius:var(--wob);padding:6px 14px;margin-left:4px}
.sv:active{background:var(--mint)}
#stageBox{flex:1;min-height:150px;position:relative;background:var(--stage);overflow:hidden;touch-action:none}
#tabs.shut .tab.on i{background:none;box-shadow:inset 0 0 0 1.5px var(--ink)}
#zoom{position:absolute;transform-origin:0 0;will-change:transform}
#zoom canvas{display:block;position:absolute;left:0;top:0;width:100%;height:100%}
#ov{pointer-events:none}

.sl{display:flex;align-items:center;gap:6px;margin:0;height:32px}
.sl .sn{flex:0 0 30%;font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl input[type=range]{flex:1;min-width:0;height:28px}
.sl b{flex:0 0 30px;text-align:right;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rs{font-size:15px;color:var(--ink);width:24px;height:24px;flex:0 0 24px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--ink);border-radius:2px;opacity:.55}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--sun);border:1.8px solid var(--ink);margin-top:-11.5px}

.bt:active{background:var(--mint)}
.bt.pri{background:var(--mint)}
.bt.red{background:#fff;color:var(--brick);border-color:var(--brick)}
.bt.sm{padding:4px 9px;font-size:13px}
.bt.grow{flex:1}
.bt[disabled]{opacity:.4}
.hint,.credit{display:none}
.ver{font-size:12px;color:var(--mut);margin:6px 0}
h4{margin:4px 0 2px;font-size:12.5px;color:var(--ink);letter-spacing:.2px}

(function(){for(var i=0;i<=L2S_N;i++){var v=i/L2S_N;L2S[i]=255*(v<=0.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-0.055)}})();

/* Đường cong tông màu (một bảng 256 mục cho cả 3 kênh) */
function buildTone(q){
  var tmp=new Float32Array(256),lut=new Uint8ClampedArray(256),m=0,i,x;
  for(i=0;i<256;i++){
    x=i/255;
    if(q.ex){var l=S2L[i]*Math.pow(2,q.ex*1.6);x=l<=0?0:(l>=1?1:(l<=0.0031308?12.92*l:1.055*Math.pow(l,1/2.4)-0.055))}
    if(q.bp){var a=q.bp*0.12;x=(x-a)/(1-a)}
    x=clamp(x,0,1);
    if(q.sh)x+=q.sh*0.32*bump(x,0.22,0.24);
    if(q.hl)x+=q.hl*0.28*bump(x,0.82,0.22);
    if(q.br)x+=q.br*(0.16*bump(x,0.28,0.25)-0.10*bump(x,0.88,0.2));

    if(q.ct){var ss=x*x*(3-2*x);x+=q.ct*0.9*(ss-x)}

    if(q.bright)x=Math.pow(x,1/(1+q.bright*0.7));
    if(q.hlr&&x>0.6)x=0.6+(x-0.6)*(1-q.hlr);
    if(q.fd)x=x*(1-q.fd)+q.fd;
    tmp[i]=clamp(x,0,1);
  }
  for(i=0;i<256;i++){if(tmp[i]>m)m=tmp[i];lut[i]=m*255}
  return lut;

var RATIOS={'1:1':1,'4:5':4/5,'3:4':3/4,'9:16':9/16,'16:9':16/9,'3:2':3/2,'2:3':2/3};

var BARE={crop:1,erase:1,beauty:1};

}

  if(pendingFull){

    var oc2=OUTC.getContext('2d');oc2.putImageData(new ImageData(out,pv.w,pv.h),0,0);if(!ui.cmp)drawFxOverlay(oc2,pv.w,pv.h,doc.p.fx);

  }else if(BARE[ui.tab]){setViewSize(W,H);ctx.drawImage(OUTC,0,0)}

function drawOv(){

    c.fillStyle='rgba(0,0,0,.55)';c.fillRect(0,0,W,r.y);c.fillRect(0,r.y+r.h,W,H-r.y-r.h);c.fillRect(0,r.y,r.x,r.h);c.fillRect(r.x+r.w,r.y,W-r.x-r.w,r.h);
    c.strokeStyle='#fff';c.lineWidth=1.5*u;c.strokeRect(r.x,r.y,r.w,r.h);
    c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=u;c.beginPath();
    for(var i=1;i<3;i++){c.moveTo(r.x+r.w*i/3,r.y);c.lineTo(r.x+r.w*i/3,r.y+r.h);c.moveTo(r.x,r.y+r.h*i/3);c.lineTo(r.x+r.w,r.y+r.h*i/3)}

  var b=doc.base,W=b.width,H=b.height,id=b.getContext('2d').getImageData(0,0,W,H);
  var out=pipe(id.data,W,H,doc.p,false);

  var f=doc.p.frame,L=frameLayout(W,H,f),sc=1,lim=15500000;

async function exportImage(fmt,q){
  busy(true,'Đang xuất ảnh…');await nextFrame();
  try{
    var fc=await buildFinal(),png=fmt==='png',type=png?'image/png':'image/jpeg';
    var blob=await toBlob(fc,type,q);
    if(!blob)throw new Error('toBlob');
    var d=new Date(),pad=function(n){return (n<10?'0':'')+n};
    var name='anh-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+(png?'.png':'.jpg');
    var file=new File([blob],name,{type:type});
    busy(false);
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return {ok:true,shared:true,w:fc.width,h:fc.height,size:blob.size}}catch(e){if(e&&e.name==='AbortError')return {ok:true,aborted:true}}
    }
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);
    toast('Đã tải ảnh về máy');
    return {ok:true,w:fc.width,h:fc.height,size:blob.size,blob:blob};
  }catch(e){busy(false);toast('Xuất ảnh lỗi: ảnh quá lớn hoặc hết bộ nhớ');return {ok:false}}
}

var THUMB={ver:-1,src:null,cache:{}};
function thumbSrc(){
  if(THUMB.ver!==doc.ver){
    var b=doc.base,s=Math.min(b.width,b.height),c=cv(120,120),x=c.getContext('2d');x.imageSmoothingQuality='high';
    x.drawImage(b,(b.width-s)/2,(b.height-s)/2,s,s,0,0,120,120);
    THUMB={ver:doc.ver,src:x.getImageData(0,0,120,120).data,cache:{}};
  }
  return THUMB.src;
}
function thumbURL(key){
  var s=thumbSrc();if(THUMB.cache[key])return THUMB.cache[key];

  var c=cv(120,120);c.getContext('2d').putImageData(new ImageData(out,120,120),0,0);

}

ACT.auto=function(){
  var pv=getPV(),d=pv.data,hist=new Uint32Array(256),n=pv.w*pv.h,sum=0,i;
  for(i=0;i<d.length;i+=4){var y=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])|0;hist[y]++;sum+=y}
  var mean=sum/n/255,acc=0,lo=0,hi=255;
  for(i=0;i<256;i++){acc+=hist[i];if(acc>=n*0.005){lo=i;break}}
  acc=0;for(i=255;i>=0;i--){acc+=hist[i];if(acc>=n*0.005){hi=i;break}}
  var a=doc.p.adj;
  a.bp=Math.round(clamp(lo/255/0.12*0.6,0,0.5)*100);a.ex=Math.round(clamp((0.46-mean)*0.9,-0.4,0.4)*100);
  a.ct=hi-lo<200?10:0;a.sh=mean<0.4?15:0;a.hl=mean>0.62?-12:0;a.vib=18;a.sat=4;
  commit();modelChanged();toast('Đã tự động chỉnh');
};

  ctx.save();roundRectPath(ctx,r.x,r.y,r.w,r.h,rad);ctx.clip();
  if(c.img){
    var iw=c.img.width,ih=c.img.height,s=Math.max(r.w/iw,r.h/ih)*c.z,dw=iw*s,dh=ih*s;
    var px=(dw-r.w)/2*c.ox,py=(dh-r.h)/2*c.oy;
    ctx.drawImage(c.img,r.x+(r.w-dw)/2-px,r.y+(r.h-dh)/2-py,dw,dh);
  }else if(edit){
    ctx.fillStyle='#E9EBF0';ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.strokeStyle='#5B6B8C';ctx.lineWidth=Math.max(2,r.w*0.012);ctx.lineCap='round';
    var cx=r.x+r.w/2,cy=r.y+r.h/2,L=Math.min(r.w,r.h)*0.12;
    ctx.beginPath();ctx.moveTo(cx-L,cy);ctx.lineTo(cx+L,cy);ctx.moveTo(cx,cy-L);ctx.lineTo(cx,cy+L);ctx.stroke();
  }
  ctx.restore();
}
function colRender(W,H,edit){
  var c=cv(W,H),x=c.getContext('2d'),rad=COL.rad*Math.min(W,H);
  x.fillStyle=COL.bg;x.fillRect(0,0,W,H);x.imageSmoothingQuality='high';
  for(var i=0;i<COL.cells.length;i++){
    var r=colCellRect(i,W,H);colDrawCell(x,COL.cells[i],r,rad,edit);
    if(edit&&i===COL.sel){x.save();x.strokeStyle='#5B6B8C';x.lineWidth=Math.max(3,W*0.006);x.setLineDash([W*0.02,W*0.012]);roundRectPath(x,r.x,r.y,r.w,r.h,rad);x.stroke();x.restore()}
  }
  return c;
}
function colDraw(){
  if(!COL.open)return;
  var st=$('#cStage'),v=$('#cCv'),bw=st.clientWidth-16,bh=st.clientHeight-16,ra=colRatioVal();
  if(bw<20||bh<20)return;
  var w=bw,h=bw/ra;if(h>bh){h=bh;w=bh*ra}
  var dpr=Math.min(2,window.devicePixelRatio||1);
  v.style.width=w+'px';v.style.height=h+'px';
  var pw=Math.round(w*dpr),ph=Math.round(h*dpr);
  v.width=pw;v.height=ph;
  v.getContext('2d').drawImage(colRender(pw,ph,true),0,0);
}
function tplSvg(t,on){
  var s='<svg viewBox="0 0 34 42">';
  t.forEach(function(r){s+='<rect x="'+(1+r[0]*32+0.8)+'" y="'+(1+r[1]*40+0.8)+'" width="'+Math.max(1,r[2]*32-1.6)+'" height="'+Math.max(1,r[3]*40-1.6)+'" rx="1.5"/>'});
  return s+'</svg>';
}
function colPanel(){
  var p=$('#cPanel'),st=p.scrollTop,h='<div class="chips">';
  [2,3,4,5,6].forEach(function(n){h+='<button class="chip'+(COL.n===n?' on':'')+'" data-ca="n:'+n+'">'+n+' ảnh</button>'});
  h+='</div><div class="chips">';
  TPLS[COL.n].forEach(function(t,i){h+='<button class="tp'+(COL.t===i?' on':'')+'" data-ca="t:'+i+'" aria-label="'+t[0]+'">'+tplSvg(t[1])+'</button>'});
  h+='</div><div class="chips">';
  CRATIOS.forEach(function(r){h+='<button class="chip'+(COL.ratio===r[0]?' on':'')+'" data-ca="ratio:'+r[0]+'">'+r[0]+'</button>'});
  h+='</div>';
  function sl(k,label,min,max,step,v,mul){return '<div class="sl"><span class="sn">'+label+'</span><input type="range" data-ck="'+k+'" data-m="'+mul+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+v+'"><b id="cv_'+k+'">'+Math.round(v*mul*10)/10+'</b></div>'}
  h+=sl('gap','Khoảng cách',0,0.08,0.002,COL.gap,100)+sl('rad','Bo góc',0,0.1,0.002,COL.rad,100);
  h+='<div class="sw"><span class="hint" style="margin-right:4px">Màu nền</span>';
  ['#ffffff','#FBF9F4','#000000','#A8D5C8','#F3D9A4','#5B6B8C','#B23A2A'].forEach(function(c){h+='<button style="background:'+c+'" class="'+(COL.bg.toLowerCase()===c.toLowerCase()?'on':'')+'" data-ca="bg:'+c+'" aria-label="màu nền"></button>'});
  h+='<input type="color" data-ck="bgc" value="'+COL.bg+'" aria-label="màu khác"></div>';
  h+='<div class="sec"><h4>'+(COL.sel>=0?'Khung số '+(COL.sel+1):'Ảnh trong khung')+'</h4>';
  if(COL.sel>=0){
    var c=COL.cells[COL.sel];
    if(c.img)h+=sl('zoom','Phóng to',1,3,0.02,c.z,1)+'<div class="hint">Kéo ngón tay trên khung để dịch ảnh.</div>';
    h+='<div class="row"><button class="bt sm" data-ca="pick">'+(c.img?'Đổi ảnh':'Chọn ảnh')+'</button>'+(c.img?'<button class="bt sm red" data-ca="clear">Bỏ ảnh</button>':'')+'</div>';
  }else h+='<div class="hint">Chạm vào một khung để chọn, chạm khung trống để thêm ảnh.</div>';
  h+='<div class="row"><button class="bt sm" data-ca="multi">Chọn nhiều ảnh cùng lúc</button></div></div>';
  h+='<div class="row"><button class="bt pri grow" data-ca="edit">Chỉnh tiếp trong Fox-e</button></div>';
  p.innerHTML=h;p.scrollTop=st;
}
function colRefresh(){colPanel();colDraw()}
async function colLoadImg(file){
  var im=await fileToImage(file),w=im.naturalWidth||im.width,h=im.naturalHeight||im.height,sc=Math.min(1,1600/Math.max(w,h));
  var c=cv(w*sc,h*sc),x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);return c;
}
function colOutSize(){var r=colRatioVal(),L=2400;return r>=1?[L,Math.round(L/r)]:[Math.round(L*r),L]}
function openCollage(){
  if(COL.open)return;
  COL.open=true;colResize();
  var d=document.createElement('div');d.id='col';
  d.innerHTML='<header id="cTop"><button class="ib" id="cClose" aria-label="Đóng"></button><div class="ttl">Ghép ảnh</div><span class="sp"></span><button class="sv" id="cSave">Lưu</button></header><div id="cStage"><canvas id="cCv"></canvas></div><section id="cPanel"></section><input type="file" id="fileCol" accept="image/*" hidden><input type="file" id="fileColM" accept="image/*" multiple hidden>';
  document.body.appendChild(d);
  $('#cClose').innerHTML=ic('undo');
  $('#cClose').addEventListener('click',closeCollage);
  $('#cSave').addEventListener('click',colSave);
  $('#fileCol').addEventListener('change',async function(e){
    var f=e.target.files&&e.target.files[0],i=COL.pickIdx;if(!f||i<0||!COL.cells[i])return;
    busy(true,'Đang mở ảnh…');await nextFrame();
    try{COL.cells[i]={img:await colLoadImg(f),z:1,ox:0,oy:0};COL.sel=i}catch(err){toast('Không mở được ảnh này')}
    busy(false);colRefresh();
  });
  $('#fileColM').addEventListener('change',async function(e){
    var fs=Array.prototype.slice.call(e.target.files||[]);if(!fs.length)return;
    var empty=[];COL.cells.forEach(function(c,i){if(!c.img)empty.push(i)});
    if(!empty.length){toast('Các khung đã đầy, hãy bỏ bớt ảnh hoặc chọn số ảnh nhiều hơn');return}
    busy(true,'Đang mở ảnh…');await nextFrame();
    try{for(var k=0;k<fs.length&&k<empty.length;k++)COL.cells[empty[k]]={img:await colLoadImg(fs[k]),z:1,ox:0,oy:0}}catch(err){toast('Có ảnh không mở được')}
    busy(false);
    if(fs.length>empty.length)toast('Chỉ có '+empty.length+' khung trống, đã bỏ '+(fs.length-empty.length)+' ảnh thừa');
    colRefresh();
  });
  var cp=$('#cPanel');
  cp.addEventListener('click',function(e){
    var b=e.target.closest('[data-ca]');if(!b)return;
    var a=b.getAttribute('data-ca'),i=a.indexOf(':'),k=i<0?a:a.slice(0,i),v=i<0?'':a.slice(i+1);
    if(k==='n'){COL.n=+v;COL.t=0;colResize()}
    else if(k==='t'){COL.t=+v;colResize()}
    else if(k==='ratio')COL.ratio=v;
    else if(k==='bg')COL.bg=v;
    else if(k==='pick'){COL.pickIdx=COL.sel;$('#fileCol').value='';$('#fileCol').click();return}
    else if(k==='multi'){$('#fileColM').value='';$('#fileColM').click();return}
    else if(k==='clear'){if(COL.sel>=0)COL.cells[COL.sel]={img:null,z:1,ox:0,oy:0}}
    else if(k==='edit'){colEdit();return}
    colRefresh();
  });
  cp.addEventListener('input',function(e){
    var t=e.target,k=t.getAttribute('data-ck');if(!k)return;
    var v=t.type==='color'?t.value:Number(t.value);
    if(k==='gap')COL.gap=v;else if(k==='rad')COL.rad=v;else if(k==='bgc'){COL.bg=v}
    else if(k==='zoom'&&COL.sel>=0)COL.cells[COL.sel].z=v;
    var lab=$('#cv_'+k);if(lab)lab.textContent=Math.round(v*Number(t.getAttribute('data-m')||1)*10)/10;
    colDraw();
  });
  var cv_=$('#cCv'),drag=null;
  function hit(e){
    var r=cv_.getBoundingClientRect(),x=(e.clientX-r.left)*cv_.width/r.width,y=(e.clientY-r.top)*cv_.height/r.height;
    for(var i=0;i<COL.cells.length;i++){var q=colCellRect(i,cv_.width,cv_.height);if(x>=q.x&&x<=q.x+q.w&&y>=q.y&&y<=q.y+q.h)return {i:i,x:x,y:y}}
    return null;
  }
  cv_.addEventListener('pointerdown',function(e){
    var h=hit(e);try{cv_.setPointerCapture(e.pointerId)}catch(err){}
    if(!h){COL.sel=-1;drag=null;colRefresh();return}
    var wasSel=COL.sel===h.i,c=COL.cells[h.i];COL.sel=h.i;
    drag={i:h.i,x:h.x,y:h.y,moved:false,empty:!c.img,wasSel:wasSel};
    colRefresh();
  });
  cv_.addEventListener('pointermove',function(e){
    if(!drag)return;
    var c=COL.cells[drag.i];if(!c||!c.img)return;
    var h2=(function(){var r=cv_.getBoundingClientRect();return {x:(e.clientX-r.left)*cv_.width/r.width,y:(e.clientY-r.top)*cv_.height/r.height}})();
    var q=colCellRect(drag.i,cv_.width,cv_.height),iw=c.img.width,ih=c.img.height,s=Math.max(q.w/iw,q.h/ih)*c.z,mx=(iw*s-q.w)/2,my=(ih*s-q.h)/2;
    var dx=h2.x-drag.x,dy=h2.y-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
    if(mx>0.5)c.ox=clamp(c.ox-dx/mx,-1,1);
    if(my>0.5)c.oy=clamp(c.oy-dy/my,-1,1);
    drag.x=h2.x;drag.y=h2.y;colDraw();
  });
  function end(){
    if(!drag)return;var d=drag;drag=null;
    if(d.empty&&!d.moved){COL.pickIdx=d.i;$('#fileCol').value='';$('#fileCol').click()}
  }
  cv_.addEventListener('pointerup',end);cv_.addEventListener('pointercancel',function(){drag=null});
  window.addEventListener('resize',colDraw);
  colPanel();requestAnimationFrame(colDraw);
}
function closeCollage(){
  var d=$('#col');if(d)d.remove();COL.open=false;COL.sel=-1;
  window.removeEventListener('resize',colDraw);
  if(doc.base)scheduleRender();
}
function colFilled(){return COL.cells.some(function(c){return c.img})}
async function colEdit(){
  if(!colFilled()){toast('Hãy thêm ít nhất một ảnh');return}
  if(doc.base&&HI>0&&!(await askConfirm('Chỉnh tiếp','Ảnh đang sửa sẽ bị thay bằng ảnh ghép. Hãy lưu trước nếu cần.','Thay bằng ảnh ghép',false)))return;
  busy(true,'Đang ghép ảnh…');await nextFrame();
  try{var s=colOutSize(),c=colRender(s[0],s[1],false);closeCollage();openCanvas(c)}catch(e){toast('Ghép ảnh lỗi: hết bộ nhớ')}
  busy(false);
}
async function colSave(){
  if(!colFilled()){toast('Hãy thêm ít nhất một ảnh');return}
  busy(true,'Đang xuất ảnh…');await nextFrame();
  try{
    var s=colOutSize(),c=colRender(s[0],s[1],false),png=LOCAL.fmt==='png',type=png?'image/png':'image/jpeg';
    var blob=await toBlob(c,type,LOCAL.q);if(!blob)throw new Error('toBlob');
    var d=new Date(),pad=function(n){return (n<10?'0':'')+n};
    var name='ghep-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+(png?'.png':'.jpg');
    var file=new File([blob],name,{type:type});
    busy(false);
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return}catch(e){if(e&&e.name==='AbortError')return}
    }
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);toast('Đã tải ảnh về máy');
  }catch(e){busy(false);toast('Xuất ảnh lỗi: ảnh quá lớn hoặc hết bộ nhớ')}
}
$('#bCollage').addEventListener('click',openCollage);
</script>
