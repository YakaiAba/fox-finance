<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Fox-finance</title>
<style>
:root{--navy:#12306B;--bg:#f4f4f6;--thu:#2e7d32;--chi:#c62828;--line:#e3e5ea;--mut:#6b7280;--tint:#eef2fb;--warn:#ef8a17}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:#111;font:16px/1.35 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select{font:inherit;font-size:16px}
#app{display:flex;flex-direction:column;height:100dvh}
header{background:#fff;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
#ttl{font-weight:700;font-size:18px;color:var(--navy);line-height:1.2}
#sy{font-size:12px;color:var(--mut);white-space:nowrap}
#sy.bad{color:var(--chi);font-weight:600}
main{flex:1;overflow-y:auto;padding:12px 14px 24px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(env(safe-area-inset-bottom) + 4px);z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:12px;font-size:12px;color:#444}
nav button i{font-style:normal;font-size:20px;line-height:1.1;height:26px;display:flex;align-items:center;justify-content:center}
.pen{display:inline-block;transform:scaleX(-1)}
nav img{display:block;-webkit-user-drag:none}
nav button.on{background:var(--tint);color:var(--navy);font-weight:700}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.seg{display:flex;background:#e9ebf0;border-radius:12px;padding:3px;margin:0 auto 12px;max-width:340px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-weight:600;color:#555}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.chi{color:var(--chi)} .seg button.on.thu{color:var(--thu)}
.tg{display:flex;gap:8px;margin:0 auto 12px;max-width:170px}
.tg button{flex:1;height:26px;border-radius:8px;font-size:20px;font-weight:700;line-height:1;border:1.5px solid;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;padding-bottom:2px}
.tg button:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.tg .thu{color:var(--thu);border-color:var(--thu)}.tg .chi{color:var(--chi);border-color:var(--chi)}
.tg .thu.on{background:var(--thu);color:#fff}.tg .chi.on{background:var(--chi);color:#fff}
.nt{flex:1;min-width:0;border:0;background:var(--tint);border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
.pd{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.pd label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.pd select{width:100%;padding:10px 4px}
button.lb{font:inherit}
.cal .top{display:flex;align-items:center;justify-content:space-between;gap:2px}.cal .st{font-size:11px;line-height:1}
.cal .ic{position:relative;display:inline-block;width:14px;height:14px;flex:none}.cal .ic .st{position:relative;z-index:1;display:block}.cal .ic .bl{position:absolute;z-index:0;left:-10px;top:0;width:18px;height:18px}.cal .ic .bl svg{width:100%;height:100%;display:block}
.pwr{padding:8px 0;border-top:1px solid var(--line)}.pwr b{display:block}.pwr small{display:block;color:var(--mut);font-size:12px}
.cal .nt2{font-size:9.5px;font-weight:600;margin-top:1px;white-space:nowrap;letter-spacing:-.3px;overflow:hidden}
.row{display:flex;align-items:center;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.row>b{width:62px;flex:none;font-size:15px}
.fld{flex:1;min-width:0;text-align:center;background:var(--tint);border-radius:10px;padding:9px 4px;font-weight:600;font-size:15px;white-space:nowrap}
.fld.big{font-size:24px;text-align:left;padding:8px 12px;font-weight:700}
.fld.act{outline:2px solid var(--navy)}
.arr{width:30px;height:36px;font-size:22px;color:#555;flex:none}
h3,h4{margin:12px 0 8px;font-size:15px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:13px;min-height:72px;justify-content:center;text-align:center;overflow:hidden}
.cb span.e{font-size:24px}
.cb.on{border:2px solid var(--navy);background:var(--tint)}
.cb small{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.primary{display:block;width:100%;background:var(--navy);color:#fff;font-weight:700;border-radius:999px;padding:14px;margin-top:14px;font-size:17px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 8px}.ch h4{margin:0}
.primary.sm{display:block;width:auto;margin:0;padding:8px 16px;font-size:15px}
.primary.chi{background:var(--chi);color:#fff} .primary.thu{background:var(--thu);color:#fff}
.ghost{display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px;margin-top:10px;font-weight:600}
.ghost.red{color:var(--chi);border-color:#e8b4b4}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sum div{flex:1 1 calc(50% - 4px);min-width:0;background:#fff;border-radius:12px;padding:8px 12px;font-size:12px;color:var(--mut)}
.sum div:nth-child(3){flex-basis:100%;display:flex;justify-content:space-between;align-items:center}
.sum b{display:block;font-size:16px;margin-top:2px;white-space:nowrap}
.sum div:nth-child(3) b{margin:0}
.sum b:not(.thu):not(.chi){color:#111}
.thu{color:var(--thu)} .chi{color:var(--chi)}
.sec{font-size:16px;font-weight:700;color:#111;margin:18px 2px 8px}
.fh,.fr{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr) minmax(0,1.1fr) minmax(0,1.4fr);gap:8px;width:100%;text-align:right;align-items:center}
.fh{font-size:clamp(11px,3.2vw,12px);color:var(--mut);padding:6px 0;border-bottom:1px solid var(--line)}
.fr{padding:11px 0;border-bottom:1px solid var(--line);font-size:clamp(11.5px,3.4vw,13.5px);font-variant-numeric:tabular-nums}
.fr>*{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh>:first-child,.fr>:first-child{text-align:left}
.fr>:first-child{white-space:normal;overflow-wrap:normal;line-height:1.15}
.ar{font-style:normal;font-size:10px;margin-left:4px;color:#6b7280}
.fr>:first-child{font-weight:700;color:var(--navy)}
.fr.on{border-bottom-color:transparent}
.fd{background:var(--tint);border-radius:10px;padding:10px;margin:0 0 8px;font-size:14px}
.fd>div{margin:4px 0}
.ch2{display:flex;align-items:center;justify-content:space-between;gap:8px}.ch2 .ct{margin:6px 0 2px}
.stb{padding:6px 14px;border-radius:999px;background:var(--tint);color:var(--navy);font-weight:600;font-size:13px}.stb.on{background:var(--navy);color:#fff}
.fd .tr{display:flex;justify-content:space-between;gap:8px;margin:6px 0;font-size:14px}
.nerr{overflow-wrap:anywhere;font-size:13px}
.fbar{display:flex;justify-content:space-between;gap:8px;margin-top:10px}.fbar .ghost{width:auto;margin:0;padding:9px 14px;font-size:14px;white-space:nowrap}
.fd .bt2{display:flex;gap:8px;margin-top:10px}
.fd .bt2 button{flex:1;padding:9px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600}
.fd .bt2 .red{color:var(--chi);border-color:#e8b4b4}
textarea.nt{display:block;width:100%;resize:vertical;line-height:1.35}
.nav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.nav .lb{flex:1;text-align:center;background:var(--tint);border-radius:10px;padding:8px;font-weight:700}
.nav .lb small{font-weight:400;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.cal .h{background:#e9ebf0;text-align:center;font-size:12px;padding:4px 0;color:#444}
.cal .h.sa{color:#1e6fd9}.cal .h.su{color:var(--chi)}
.cal>button{min-height:58px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:3px 2px;text-align:left;display:flex;flex-direction:column;font-size:11px;line-height:1.2;overflow:hidden;background:#fff}
.cal>button.o{background:#f3f3f5;color:#aaa}
.cal>button.sel{background:#fff6dc}
.cal>button.td .d{color:#fff;background:var(--navy);border-radius:9px;padding:0 5px;align-self:flex-start}
.cdp{grid-column:1/-1;margin:4px 4px 6px;border-radius:10px}
.evr{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.evr .cdr{border:0;flex:1;width:auto}
.evx{flex:none;padding:6px 12px;border-radius:999px;border:1px solid #e8b4b4;color:var(--chi);background:#fff;font-weight:600}
.cal .d{font-size:13px}.cal .t{color:var(--thu)}.cal .c{color:var(--chi)}
.er{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.er .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.er .nm{flex:1;min-width:0}.er .nm small{display:block;color:var(--mut)}
.er .am{font-weight:700;white-space:nowrap}
.dh{display:flex;justify-content:space-between;background:#e9ebf0;border-radius:8px;padding:6px 10px;font-size:13px;margin:10px 0 2px}
.bar{height:10px;border-radius:6px;background:#e5e7ec;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;border-radius:6px}
.br{width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.br .t1{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.br .t2{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.li{display:flex;align-items:center;gap:10px;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);text-align:left}
.li:last-child{border-bottom:0}
.li i{font-style:normal;width:26px;text-align:center;font-size:20px}
.li span{flex:1}.li em{font-style:normal;color:var(--mut);font-size:13px}
.li:after{content:"›";color:#999;font-size:20px}
.ct{font-weight:700;font-size:14px;margin:6px 0 2px}.cs{font-size:12px;color:var(--mut)}
.warn{background:#fdecea;color:var(--chi);border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.ok{background:#e8f5e9;color:var(--thu);border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.mut{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:8px 0;font-size:13px}
.inp{width:100%;border:1px solid #cfd3da;border-radius:10px;padding:10px;background:#fff}
label.l{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
.chips{display:flex;gap:6px;margin:8px 0}
.chips button{padding:6px 12px;border-radius:999px;background:#e9ebf0;font-size:14px}
.chips button.on{background:var(--navy);color:#fff}
.pgr{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.pgr button{min-width:34px;padding:6px 8px;border-radius:8px;background:#e9ebf0}
.pgr button.on{background:var(--navy);color:#fff}
#page{position:fixed;inset:0;background:var(--bg);z-index:15;display:none;flex-direction:column}
#page.show{display:flex}
.ph{background:#fff;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.ph button{font-size:28px;width:40px;height:36px;color:var(--navy)}
#ptt{font-weight:700;font-size:17px}
.pb{flex:1;overflow-y:auto;padding:12px 14px 24px;-webkit-overflow-scrolling:touch}
.pf{background:#fff;border-top:1px solid var(--line);padding:8px 14px calc(env(safe-area-inset-bottom) + 8px)}
.pf button{display:block;width:100%;padding:12px;border-radius:999px;background:var(--navy);color:#fff;font-weight:700}
body.kp .pb,body.kp main{padding-bottom:330px}
#kp{position:fixed;left:0;right:0;bottom:0;background:#fff;z-index:30;border-radius:22px 22px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.18);padding:0 8px calc(env(safe-area-inset-bottom) + 8px);display:none}
#kp.show{display:block}
.kpt{display:flex;justify-content:space-between;padding:6px 4px}
.kpt button{width:44px;height:36px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:20px}
.kg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.kg button{background:#e9e9ec;border-radius:10px;height:50px;font-size:24px;font-weight:600;box-shadow:0 2px 0 #c9c9ce}
.kg button.op{color:#444}.kg .del{color:#e8532f}.kg .eq{grid-column:5;grid-row:3/5;height:auto;color:#2b8be6;font-size:28px}
.kg .z2{grid-column:span 2}
#dl{position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.4);align-items:center;justify-content:center;padding:20px}
#dl.show{display:flex}
.dlg{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:360px;max-height:88dvh;overflow-y:auto}
.dlg h2{margin:0 0 8px;font-size:18px;color:var(--navy)}
.dlg .bt{display:flex;gap:10px;margin-top:14px}
.dlg .bt button{flex:1;padding:11px;border-radius:12px;background:#e9ebf0;font-weight:700}
.dlg .bt button.pr{background:var(--navy);color:#fff}.dlg .bt button.dg{background:var(--chi);color:#fff}
.dlg select{padding:10px;border:1px solid #cfd3da;border-radius:10px;background:#fff;flex:1;min-width:0}
.emo{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.emo .eg{grid-column:1/-1;font-size:12px;color:var(--mut);font-weight:600;margin-top:6px}
.emo button{font-size:22px;padding:6px 0;border-radius:10px;border:1px solid var(--line)}
.emo button.on{border:2px solid var(--navy);background:var(--tint)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(20,20,30,.92);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;display:none;max-width:86%;text-align:center}
svg text{font-family:inherit}
.wsec{margin-top:16px;padding-top:6px;border-top:1px solid var(--line)}
.wrow{display:flex;gap:8px;align-items:stretch}.wrow .inp{flex:1;min-width:0;width:auto}
.uni{display:flex;background:#e9ebf0;border-radius:10px;padding:3px;flex:none}
.uni button{min-width:46px;padding:0 10px;border-radius:8px;font-weight:700;font-size:16px;color:#555}
.uni button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.wh{font-size:12.5px;color:var(--mut);margin-top:4px;min-height:1em}
.fr small{display:block;font-size:11.5px;line-height:1.2}
.cdr{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.cdr .nm{min-width:0;font-weight:600;overflow-wrap:anywhere;color:var(--navy)}
.cdr small{display:block;color:var(--mut);font-weight:400;font-size:12px;line-height:1.3}
.cdr .rm{flex:none;text-align:right;font-weight:700;font-size:14px;color:#111}
.cdr .rm small{font-size:11.5px}
.cdr.past{opacity:.55}
.cdadd{flex:none;padding:7px 16px;border-radius:999px;background:var(--navy);color:#fff;font-weight:600}
#lk{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 16px) 20px}
#lk.show{display:flex}
#lk h2{margin:0 0 4px;font-size:20px;color:var(--navy)}
#lk .ls{color:#666;font-size:14px;min-height:20px;margin-bottom:16px;text-align:center}
#lk .ld{display:flex;gap:14px;margin-bottom:10px}
#lk .ld i{width:14px;height:14px;border-radius:50%;border:2px solid var(--navy)}
#lk .ld i.on{background:var(--navy)}
#lk .le{min-height:20px;color:var(--chi);font-weight:600;font-size:14px;margin-bottom:10px}
#lk .lp{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
#lk .lp button{height:62px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:24px;font-weight:600;color:var(--navy)}
#lk .lp button.x{background:none;border:0;font-size:14px;color:#555}
#lk.sh .ld{animation:lksh .3s}
@keyframes lksh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lgr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.lgr small{font-size:12px;font-weight:400;color:var(--mut)}
.tot{display:flex;justify-content:space-between;align-items:center;padding:12px 0 2px;font-size:18px;font-weight:700}
.tot b{font-size:22px}
.sec.tg{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:0 2px;background:none;border:0}
.sec.tg i{font-style:normal;font-size:14px;color:#6b7280}
.icr{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px 0;font-weight:700}
.icr small{font-weight:600;color:var(--mut);font-size:13px}.icr i{font-style:normal;font-size:12px;color:#6b7280;margin-left:6px}
.ig{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr) minmax(0,1.3fr);gap:8px;width:100%;text-align:right;align-items:center}
.ih{font-size:12px;color:var(--mut);padding:6px 0;border-bottom:1px solid var(--line)}
.ir{padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ig>:first-child{text-align:left}.ir>:first-child{font-weight:700;color:var(--navy);overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="app">
  <header><div id="ttl"></div><div id="sy"></div></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="page"><div class="ph"><button id="pback" aria-label="Quay lại">‹</button><div id="ptt"></div></div><div class="pb" id="pbody"></div><div class="pf"><button id="pexit">Thoát</button></div></div>
<div id="kp">
  <div class="kpt"><button data-k="hide" aria-label="Ẩn bàn phím">⌄</button><button data-k="ok" aria-label="Xong" style="color:var(--navy);font-weight:700">✓</button></div>
  <div class="kg">
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="÷">÷</button><button class="op" data-k="AC">AC</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="×">×</button><button class="del" data-k="Del">Del</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="-">-</button><button class="eq" data-k="=">=</button>
    <button data-k="0">0</button><button class="z2" data-k="000">000</button><button class="op" data-k="+">+</button>
  </div>
</div>
<div id="dl"></div>
<div id="lk"></div>
<div id="toast"></div>
<script>
(function(){
'use strict';
var APP_VER='1.55 (07/11/2026)';
var KEY='chitieu.v1',LKEY='chitieu.local',SKEY='chitieu.sync';

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function jget(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function pad(n){return String(n).padStart(2,'0')}
function ds(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
function today(){var t=new Date();return ds(t.getFullYear(),t.getMonth()+1,t.getDate())}
function parse(s){var a=s.split('-').map(Number);return {y:a[0],m:a[1],d:a[2]}}
var WD=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
function wdOf(s){var p=parse(s);return new Date(p.y,p.m-1,p.d).getDay()}
function dlabel(s){var p=parse(s);return pad(p.d)+'/'+pad(p.m)+'/'+p.y+' ('+WD[wdOf(s)]+')'}
function dshort(s){var p=parse(s);return pad(p.d)+'/'+pad(p.m)+'/'+p.y}
function addDays(s,n){var p=parse(s);var t=new Date(p.y,p.m-1,p.d+n);return ds(t.getFullYear(),t.getMonth()+1,t.getDate())}
function dim(y,m){return new Date(y,m,0).getDate()}
function fmt(n){n=Math.round(n);var neg=n<0;var s=String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'-':'')+s}
function money(n){return fmt(n)+'đ'}
function fmtShort(n){if(n>=1e9)return (n/1e9).toFixed(1).replace('.',',').replace(',0','')+'tỷ';if(n>=1e6)return (n/1e6).toFixed(1).replace('.',',').replace(',0','')+'tr';if(n>=1e3)return (n/1e3).toFixed(1).replace('.',',').replace(',0','')+'k';return String(n)}
function norm(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function hhmm(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}

function seed(){
  if(D.cats.length)return;
  DEF_CHI.forEach(function(c,i){D.cats.push({id:'dc'+i,type:'chi',name:c[0],icon:c[1],color:PAL[i%PAL.length],order:i*10,updated:0})});
  DEF_THU.forEach(function(c,i){D.cats.push({id:'dt'+i,type:'thu',name:c[0],icon:c[1],color:PAL[(i+3)%PAL.length],order:i*10,updated:0})});
  save();
}

function cat(id){return D.cats.find(function(c){return c.id===id})||{name:'(đã xóa)',icon:'❔',color:'#999'}}
function bud(key){return D.budgets.find(function(b){return b.id===key&&!b.deleted})}

var KP={st:null,form:null};
function evalExpr(e){
  e=e.replace(/[+\-×÷]+$/,'');if(!e)return 0;
  var t=e.split(/([+\-×÷])/),nums=[+t[0]],ops=[],i;
  for(i=1;i<t.length;i+=2){ops.push(t[i]);nums.push(+t[i+1])}
  var n2=[nums[0]],o2=[];
  for(i=0;i<ops.length;i++){
    if(ops[i]==='×')n2[n2.length-1]*=nums[i+1];
    else if(ops[i]==='÷'){if(nums[i+1]===0)return null;n2[n2.length-1]/=nums[i+1]}
    else{o2.push(ops[i]);n2.push(nums[i+1])}
  }
  var r=n2[0];o2.forEach(function(o,j){r=o==='+'?r+n2[j+1]:r-n2[j+1]});
  return Math.round(r);
}
function exprText(e){if(!e)return '0';return e.replace(/\d+/g,function(n){return fmt(+n)}).replace(/[+\-×÷]/g,' $& ')}
function kpUpdate(){
  var el=KP.form&&document.querySelector('.frm[data-form="'+KP.form+'"] [data-f="amt"]');
  if(el)el.textContent=exprText(KP.st.expr);
}
function kpOpen(st,form){
  KP.st=st;KP.form=form;$('#kp').classList.add('show');document.body.classList.add('kp');
  var el=document.querySelector('.frm[data-form="'+form+'"] [data-f="amt"]');if(el)el.classList.add('act');
}
function kpClose(){
  if(KP.st){var v=evalExpr(KP.st.expr);if(v==null||v<0)KP.st.expr='';else if(KP.st.expr)KP.st.expr=String(v)}
  kpUpdate();
  var el=document.querySelector('.frm[data-form="'+KP.form+'"] [data-f="amt"]');if(el)el.classList.remove('act');
  $('#kp').classList.remove('show');document.body.classList.remove('kp');KP.st=null;KP.form=null;
}
function kpKey(k){
  if(k==='hide'||k==='ok'){kpClose();return}
  var st=KP.st;if(!st)return;var e=st.expr||'';
  if(/^\d+$/.test(k)){
    var m=e.match(/\d*$/)[0];
    if(k==='000'&&m==='')return;
    if(m==='0'){if(/^0+$/.test(k))return;e=e.slice(0,-1)}
    if(m.length+k.length>12)return;
    e+=k;
  }else if('+-×÷'.indexOf(k)>=0){
    if(!e)return;
    if(/[+\-×÷]$/.test(e))e=e.slice(0,-1)+k;else e+=k;
  }else if(k==='AC')e='';
  else if(k==='Del')e=e.slice(0,-1);
  else if(k==='='){var v=evalExpr(e);if(v==null){toast('Không chia được cho 0');return}if(v<0){toast('Kết quả âm');e=''}else e=v?String(v):''}
  st.expr=e;kpUpdate();
}

function formHTML(st,edit,form){
  var cs=catsOf(st.type);
  if(!cs.find(function(c){return c.id===st.cat}))st.cat=cs[0]?cs[0].id:null;
  var chi=st.type==='chi';
  var h='<div class="seg"><button data-f="type" data-v="thu" class="thu'+(chi?'':' on')+'">Thu nhập</button><button data-f="type" data-v="chi" class="chi'+(chi?' on':'')+'">Chi tiêu</button></div>';
  h+='<div class="row"><b>Ngày</b><button class="arr" data-f="dm">‹</button><button class="fld" data-f="date">'+dlabel(st.date)+'</button><button class="arr" data-f="dp">›</button></div>';
  h+='<div class="row"><b>'+(chi?'Tiền chi':'Tiền thu')+'</b><button class="fld big" data-f="amt">'+exprText(st.expr)+'</button><span>đ</span></div>';
  h+='<div class="row"><b>Ghi chú</b><input class="nt" data-f="note" maxlength="60" placeholder="Chưa nhập vào" autocomplete="off" value="'+esc(st.note||'')+'"></div>';
  h+='<div class="ch"><h4>Danh mục</h4><button class="primary sm '+st.type+'" data-f="ok">'+(edit?(chi?'Chỉnh sửa khoản chi':'Chỉnh sửa khoản thu'):(chi?'Nhập khoản chi':'Nhập khoản thu'))+'</button></div><div class="grid">';
  cs.forEach(function(c){h+='<button class="cb'+(c.id===st.cat?' on':'')+'" data-f="cat" data-v="'+c.id+'"><span class="e">'+c.icon+'</span><small>'+esc(c.name)+'</small></button>'});
  h+='<button class="cb" data-a="pg" data-p="cats" data-arg="'+st.type+'"><span class="e">＋</span><small>Chỉnh sửa ›</small></button></div>';
  return h;
}
function stOf(form){return form==='edit'?editSt:V.nhap}
function formClick(t){
  var frm=t.closest('.frm');var form=frm.dataset.form;var st=stOf(form);var f=t.dataset.f;
  function redo(){if(form==='edit')renderPage();else render()}
  if(f==='type'){if(st.type!==t.dataset.v){st.type=t.dataset.v;st.cat=null;redo()}}
  else if(f==='cat'){st.cat=t.dataset.v;redo()}
  else if(f==='dm'){st.date=addDays(st.date,-1);redo()}
  else if(f==='dp'){st.date=addDays(st.date,1);redo()}
  else if(f==='date'){pickDate(st.date,function(v){st.date=v;redo()})}
  else if(f==='amt'){kpOpen(st,form)}
  else if(f==='ok'){
    if(KP.st)kpClose();
    var v=evalExpr(st.expr);
    if(v==null){toast('Không chia được cho 0');return}
    if(!v||v<=0){toast('Nhập số tiền lớn hơn 0');return}
    if(!st.cat){toast('Chọn danh mục');return}
    if(form==='edit'){
      var e=D.entries.find(function(x){return x.id===st.id});
      if(e){e.type=st.type;e.date=st.date;e.amount=v;e.cat=st.cat;e.note=(st.note||'').trim();touch(e)}
      popPage();toast('Đã sửa khoản');changed();
    }else{
      var n={id:uid(),type:st.type,date:st.date,amount:v,cat:st.cat,note:(st.note||'').trim()};touch(n);D.entries.push(n);
      st.expr='';st.note='';toast('Đã lưu '+money(v)+' – '+cat(st.cat).name);changed();
    }
  }
}
function pickDate(cur,cb){
  var p=parse(cur),yr=new Date().getFullYear();
  function opts(a,b,sel,f){var h='';for(var i=a;i<=b;i++)h+='<option value="'+i+'"'+(i===sel?' selected':'')+'>'+(f?f(i):i)+'</option>';return h}
  dlg('<h2>Chọn ngày</h2><div class="pd"><div><label for="pd">Ngày</label><select id="pd">'+opts(1,dim(p.y,p.m),p.d)+'</select></div><div><label for="pm">Tháng</label><select id="pm">'+opts(1,12,p.m)+'</select></div><div><label for="py">Năm</label><select id="py">'+opts(yr-15,yr+5,p.y)+'</select></div></div>',
    [{t:'Hôm nay',f:function(){cb(today())}},{t:'Bỏ qua'},{t:'Chọn',c:'pr',f:function(){cb(ds(+$('#py').value,+$('#pm').value,Math.min(+$('#pd').value,dim(+$('#py').value,+$('#pm').value))))}}],
    function(){
      function fix(){var y=+$('#py').value,m=+$('#pm').value,d=Math.min(+$('#pd').value,dim(y,m));$('#pd').innerHTML=opts(1,dim(y,m),d)}
      $('#pm').onchange=fix;$('#py').onchange=fix;
    });
}

  $('#ttl').textContent=L.title;

  var m=$('#main');
  if(tab==='nhap'){m.innerHTML='<div class="card frm" data-form="nhap">'+formHTML(V.nhap,false,'nhap')+'</div>';if(KP.form==='nhap'){var el=m.querySelector('[data-f="amt"]');if(el)el.classList.add('act')}}
  else if(tab==='cal'){m.innerHTML=calHTML();fitCal()}

  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(!/^\d+\.\d{1,2}$/.test(s))s=s.replace(/\./g,'');
  var v=parseFloat(s);return isFinite(v)&&v>0?v:0;
}

  else ip=raw;

function priceUrl(){return DEFAULT_PRICE_URL}
function priceReqUrl(codes){var u=priceUrl();return u+(u.indexOf('?')<0?'?':'&')+'codes='+encodeURIComponent(codes.join(','))}
function autoNav(){
  if(NAV.busy||!(funds().length||watches().length)||!(priceUrl()||(S.url&&S.secret)))return;

function navDirect(code){
  var body={types:['NEW_FUND','TRADING_FUND'],issuerIds:[],sortOrder:'DESC',sortField:'navTo6Months',page:1,pageSize:20,isIpo:false,fundAssetTypes:[],bondRemainPeriods:[],searchField:code,isBuyByReward:false,thirdAppIds:[]};
  return fetch('https://api.fmarket.vn/res/products/filter',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
    var d=(j&&j.data)||j||{},rows=d.rows||d.items||d.content||[],row=null;
    rows.forEach(function(x){if(!row&&String(x.shortName||x.code||x.productCode||'').toUpperCase()===code)row=x});
    if(!row)throw new Error('không tìm thấy mã');
    var nav=Number(row.nav||row.navPrice||row.lastNav||row.currentNav);if(!(nav>0))throw new Error('không đọc được giá');
    var raw=row.lastNavDate||row.navDate||'',dt=typeof raw==='number'?new Date(raw):null;
    return {nav:nav,date:dt?ds(dt.getFullYear(),dt.getMonth()+1,dt.getDate()):(/^\d{4}-\d{2}-\d{2}/.test(String(raw))?String(raw).slice(0,10):''),name:row.name||'',type:String((row.dataFundAssetType&&row.dataFundAssetType.name)||row.fundType||'')};
  });
}
function fetchNav(manual){
  var fs=funds().concat(watches());if(!fs.length||NAV.busy)return;
  var codes=[];fs.forEach(function(f){if(codes.indexOf(f.code)<0)codes.push(f.code)});
  NAV.busy=true;L.navAt=Date.now();saveL();refreshAssets();
  var got={},err='';
  var p;
  var usePrice=!!priceUrl(),useSync=!usePrice&&S.url&&S.secret;
  if(usePrice||useSync){
    var ctl=typeof AbortController!=='undefined'?new AbortController():null,to=setTimeout(function(){ctl&&ctl.abort()},30000),sg=ctl?ctl.signal:undefined;
    var rq=usePrice?fetch(priceReqUrl(codes),{signal:sg}):fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:S.secret,action:'nav',codes:codes}),signal:sg});
    p=rq.then(function(r){return r.json()})
    .then(function(j){
      clearTimeout(to);
      if(!j.ok)err=j.err==='secret'?'Sai mã bí mật':'Máy chủ báo lỗi';
      else if(!j.navs)err=usePrice?'Địa chỉ lấy giá không đúng':'Cần cập nhật Code.gs lên bản mới để lấy giá';
      else{
        var bad=[],perm=false;L.nav=L.nav||{};
        codes.forEach(function(c){if(j.navs[c]&&j.navs[c].nav>0){L.nav[c]=Object.assign({at:Date.now()},j.navs[c]);got[c]=1}else{var e=j.errs&&j.errs[c]||'';if(/external_request|quyền|permission/i.test(e))perm=true;bad.push(c+(e?' ('+e+')':''))}});
        err=perm?'Apps Script chưa được cấp quyền gọi ra ngoài. Mở Apps Script, chạy hàm capQuyen và bấm Cho phép, rồi Triển khai > Phiên bản mới.':(bad.length?'Không lấy được giá: '+bad.join(', '):'');
      }
    })
    .catch(function(){clearTimeout(to);err='Không kết nối được máy chủ'});
  }else{p=Promise.resolve();err='Bật đồng bộ Google Sheets để tự lấy giá, hoặc nhập giá tay.'}
  p.then(function(){
    var miss=codes.filter(function(c){return !got[c]});
    return Promise.all(miss.map(function(c){return navDirect(c).then(function(r){L.nav=L.nav||{};L.nav[c]=Object.assign({at:Date.now()},r);got[c]=1}).catch(function(){})}));
  }).then(function(){
    var n=Object.keys(got).length;
    if(n===codes.length)err='';
    if(n)L.navOk=Date.now();
    L.navErr=err;
    NAV.busy=false;saveL();refreshAssets();
    if(n){checkAlerts();snapFund()}
  });
}

/* Khác */
function backupInfo(){
  if(!L.lastBackup)return {bad:true,txt:'Chưa sao lưu lần nào'};
  var days=(Date.now()-L.lastBackup)/864e5;
  return {bad:days>3,txt:'Sao lưu gần nhất: '+dshort(ds(new Date(L.lastBackup).getFullYear(),new Date(L.lastBackup).getMonth()+1,new Date(L.lastBackup).getDate()))+(days>3?' ('+Math.floor(days)+' ngày trước)':'')};
}
function moreHTML(){
  var bk=backupInfo(),h='';
  h+='<div class="'+(bk.bad?'warn':'ok')+'">'+(bk.bad?'⚠ ':'✓ ')+bk.txt+'</div>';
  h+='<div class="card"><button class="li" data-a="pg" data-p="basic"><i>⚙️</i><span>Cài đặt</span></button><button class="li" data-a="pg" data-p="secu"><i>🔒</i><span>Bảo mật ứng dụng</span><em>'+(lkSet()?'Đã thiết lập':'Chưa thiết lập')+'</em></button></div>';
  h+='<div class="card"><button class="li" data-a="pg" data-p="search"><i>🔍</i><span>Tìm kiếm giao dịch</span></button><button class="li" data-a="pg" data-p="balance"><i>📈</i><span>Báo cáo biến động số dư</span></button></div>';
  h+='<div class="card"><button class="li" data-a="pg" data-p="sync"><i>☁️</i><span>Đồng bộ Google Sheets</span><em>'+(S.url?esc(SYN.msg||''):'Chưa bật')+'</em></button><button class="li" data-a="pg" data-p="backup"><i>💾</i><span>Sao lưu dữ liệu</span></button><button class="li" data-a="pg" data-p="help"><i>📖</i><span>Hướng dẫn sử dụng</span></button><button class="li" data-a="pg" data-p="about"><i>ℹ️</i><span>Thông tin ứng dụng</span></button></div>';
  return h;
}

var PTITLE={secu:'Bảo mật ứng dụng',inv:'Tài sản',edit:'Chỉnh sửa',cats:'Danh mục thu chi',basic:'Cài đặt',sync:'Đồng bộ Google Sheets',balance:'Báo cáo biến động số dư',search:'Tìm kiếm giao dịch',fundrep:'Báo cáo biến động chứng chỉ quỹ',backup:'Sao lưu dữ liệu',about:'Thông tin ứng dụng',catlist:'Chi tiết danh mục',fund:'Mã quỹ',watch:'Chờ đợi giá',pw:'Vị trí',cd:'Sự kiện',cdsug:'Ngày lễ gợi ý',help:'Hướng dẫn sử dụng'};
function openPage(name,arg){
  if(name==='edit'){
    var e=D.entries.find(function(x){return x.id===arg});if(!e)return;
    editSt={id:e.id,type:e.type,date:e.date,expr:String(e.amount),cat:e.cat,note:e.note||''};
  }
  if(name==='inv'){
    var io=arg&&arg.indexOf('new:')!==0&&D.assets.find(function(x){return x.id===arg});
    invSt=io?{id:io.id,cat:io.cat,code:io.code||'',man:io.man?liveFmt(numStr(io.man)):'',term:io.term>0?String(io.term):'',rate:io.rate?liveFmt(numStr(io.rate)):'',name:io.name,qty:liveFmt(numStr(io.qty)),unit:io.unit||'',buy:liveFmt(numStr(io.buy)),date:io.date,note:io.note||''}:{id:null,cat:String(arg).slice(4),code:'',man:'',term:'',rate:'',name:'',qty:'',unit:'',buy:'',date:today(),note:''};
  }
  if(name==='fund'){
    var fo=arg&&D.assets.find(function(x){return x.id===arg});
    fundSt=fo?{id:fo.id,code:fo.code,qty:liveFmt(numStr(fo.qty)),buy:liveFmt(numStr(fo.buy)),man:fo.man?liveFmt(numStr(fo.man)):'',date:fo.date}:{id:null,code:'',qty:'',buy:'',man:'',date:today()};
  }
  if(name==='cd'){
    var co=arg&&D.assets.find(function(x){return x.id===arg});
    cdSt=co?{id:co.id,name:co.name,date:co.date,rep:repKind(co)}:{id:null,name:'',date:today(),rep:''};
  }
  if(name==='pw'){
    var po=arg&&D.assets.find(function(x){return x.id===arg});
    pwSt=po?{id:po.id,slug:po.slug,ward:po.ward||'',kp:po.kp||'',own:PWD.some(function(x){return x[0]===po.slug})?'':po.slug,other:po.slug!=='thanh-pho-phu-quoc'}:{id:null,slug:'',ward:'',kp:'',own:''};
  }
  if(name==='cdsug')cdY=new Date().getFullYear();
  if(name==='watch'){
    var wo=arg&&D.assets.find(function(x){return x.id===arg});
    var we=wo&&wExp(wo);
    watchSt=wo?{id:wo.id,code:wo.code,ref:liveFmt(numStr(wo.ref)),dir:we.dir,val:we.v?liveFmt(numStr(we.v)):'',unit:we.u}:{id:null,code:'',ref:'',dir:'dn',val:'',unit:'d'};
  }
  pages.push({name:name,arg:arg,pg:0,q:'',ft:'all'});
  $('#page').classList.add('show');renderPage();$('#pbody').scrollTop=0;
}
function popPage(){
  pages.pop();
  if(!pages.length){$('#page').classList.remove('show');$('#pbody').innerHTML=''}
}
function closePage(){
  if(KP.st)kpClose();
  popPage();
  render();
}
var SETP={basic:1,sync:1,cats:1,catlist:0,backup:1};
function renderPage(){
  var p=pages[pages.length-1];if(!p)return;
  $('#ptt').textContent=p.name==='catlist'?cat(p.arg).name:p.name==='fund'?(fundSt.id?'Sửa mã quỹ':'Thêm mã quỹ'):p.name==='inv'?(invSt.cat==='saving'?(invSt.id?'Sửa khoản gửi':'Thêm khoản gửi'):(invSt.id?'Sửa tài sản':'Thêm tài sản')):p.name==='watch'?(watchSt.id?'Sửa mã chờ giá':'Thêm mã chờ giá'):p.name==='cd'?(cdSt.id?'Sửa sự kiện':'Thêm sự kiện'):p.name==='pw'?(pwSt.id?'Sửa vị trí':'Thêm vị trí'):PTITLE[p.name];
  $('#pexit').textContent=SETP[p.name]?'Lưu lại & Thoát':'Thoát';
  var b=$('#pbody'),top=b.scrollTop;
  var fn={edit:pgEdit,cats:pgCats,basic:pgBasic,sync:pgSync,balance:pgBalance,search:pgSearch,fundrep:pgFundRep,inv:pgInv,secu:pgSecu,backup:pgBackup,about:pgAbout,catlist:pgCatList,fund:pgFund,watch:pgWatch,cd:pgCd,pw:pgPw,cdsug:pgCdSug,help:pgHelp}[p.name];
  b.innerHTML=fn(p);
  b.scrollTop=top;
  if(p.name==='fundrep')fitCal();
  if(p.name==='basic'||p.name==='sync'||p.name==='search'||p.name==='fund'||p.name==='watch'||p.name==='cd'||p.name==='inv'||p.name==='pw')bindPageInputs(p);

function lockUI(o){

    var d='';for(var i=0;i<LKN;i++)d+='<i class="'+(i<buf.length?'on':'')+'"></i>';

  }

  function bio(){if(!o.bio)return;o.bio().then(function(){done();o.ok&&o.ok()}).catch(function(){})}

    var b=e.target.closest('[data-lk]');if(!b)return;var v=b.dataset.lk;
    if(v==='cancel'){done();o.onCancel&&o.onCancel();return}
    if(v==='bio'){bio();return}
    if(v==='del'){buf=buf.slice(0,-1);paint();return}
    if(buf.length>=LKN)return;buf+=v;paint();
    if(buf.length<LKN)return;
    var pin=buf;
    Promise.resolve(o.submit(pin)).then(function(r){
      if(r===true){done();o.ok&&o.ok(pin)}
      else if(r&&typeof r==='object'){o=Object.assign({},o,r);buf='';paint()}
      else{buf='';paint(r||'Sai mã PIN');el.classList.remove('sh');void el.offsetWidth;el.classList.add('sh')}
    });
  };

function ddiff(a,b){var x=parse(a),y=parse(b);return Math.round((Date.UTC(y.y,y.m-1,y.d)-Date.UTC(x.y,x.m-1,x.d))/864e5)}

function pgBalance(){

function searchRes(p){
  var q=norm(p.q),dg=p.q.replace(/\D/g,'');
  var list=E().filter(function(e){
    if(p.ft!=='all'&&e.type!==p.ft)return false;
    if(!q)return true;
    return norm(cat(e.cat).name).indexOf(q)>=0||norm(e.note||'').indexOf(q)>=0||(dg&&String(e.amount).indexOf(dg)>=0)||dshort(e.date).indexOf(p.q.trim())>=0;
  }).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1)});
  var tot=0;list.forEach(function(e){tot+=e.type==='thu'?e.amount:-e.amount});
  return '<div class="dh"><span>'+list.length+' kết quả</span><b>'+(list.length?(tot>=0?'+':'-')+money(Math.abs(tot)):'')+'</b></div>'+(list.slice(p.pg*20,p.pg*20+20).map(function(e){return entryRow(e,true)}).join('')||'<div class="empty">Không tìm thấy</div>')+pager(list.length,p.pg,20);
}

function checkAuto(){
  var m=L.auto;if(m!=='day'&&m!=='week')return;
  var n=new Date(),b=new Date(n.getFullYear(),n.getMonth(),n.getDate(),21,0,0);
  if(m==='day'){if(n<b)b.setDate(b.getDate()-1)}
  else{b.setDate(b.getDate()-b.getDay());if(n<b)b.setDate(b.getDate()-7)}

function shareFile(file,blob){
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).then(function(){fileDone(file)}).catch(function(){})}
  else{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500);fileDone(file)}
}

function exportBackup(){
  var out={app:'chitieu',ver:1,exported:Date.now(),data:{}};
  LISTS.forEach(function(l){out.data[l]=D[l].map(function(r){var c=Object.assign({},r);delete c._l;return c})});
  var t=new Date(),name='fox-finance_'+t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())+'.json';
  var blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  shareFile(new File([blob],name,{type:'application/json'}),blob);
}
function mergeList(list,recs,mark){
  var map={};D[list].forEach(function(r,i){map[r.id]=i});var n=0;
  recs.forEach(function(r){
    if(!r||!r.id)return;
    var i=map[r.id],c=Object.assign({},r);delete c._l;if(mark)c._l=1;
    if(i===undefined){D[list].push(c);map[r.id]=D[list].length-1;n++}
    else if((r.updated||0)>(D[list][i].updated||0)){D[list][i]=c;n++}
  });
  return n;
}
function importBackup(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var j=JSON.parse(rd.result);if(!j||j.app!=='chitieu'||!j.data)throw 0;
      var n=0;LISTS.forEach(function(l){if(Array.isArray(j.data[l]))n+=mergeList(l,j.data[l],true)});
      changed();toast('Đã gộp '+n+' bản ghi mới/đổi');
    }catch(e){toast('File không đúng định dạng sao lưu của ứng dụng này')}
  };
  rd.readAsText(file);
}

var SYN={msg:'',busy:false,fail:0,t:null};
function dirty(){return SL().some(function(l){return D[l].some(function(r){return r._l})})}
function setSy(m,bad){SYN.msg=m;SYN.bad=!!bad;renderSy();var s=$('#sst');if(s)s.textContent=m}
function renderSy(){var s=$('#sy');s.textContent=S.url?SYN.msg:'';s.className=SYN.bad?'bad':''}
function schedSync(ms){
  if(!S.url||!S.secret)return;
  if(!SYN.busy&&dirty()&&!SYN.bad)setSy('⏳ Chờ gửi');
  clearTimeout(SYN.t);SYN.t=setTimeout(function(){doSync()},ms);
}
function doSync(manual){
  if(!S.url||!S.secret){setSy('');return Promise.resolve()}
  if(SYN.busy)return Promise.resolve();
  SYN.busy=true;setSy('⏳ Đang đồng bộ…');
  var out={},sent={};
  var sl=SL();
  sl.forEach(function(l){out[l]=D[l].filter(function(r){return r._l}).map(function(r){var c=Object.assign({},r);delete c._l;return c})});
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;var to=setTimeout(function(){ctl&&ctl.abort()},30000);
  return fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:S.secret,dev:L.dev,cursor:S.cursor,ver:APP_VER,lists:sl,records:out}),signal:ctl?ctl.signal:undefined})
  .then(function(r){return r.json()})
  .then(function(j){
    if(!j.ok){
      if(j.err==='secret'){setSy('⚠ Sai mã bí mật',true);SYN.fail=0;return}
      throw new Error(j.err||'loi');
    }
    sl.forEach(function(l){out[l].forEach(function(o){var r=D[l].find(function(x){return x.id===o.id});if(r&&r.updated===o.updated)delete r._l})});
    var n=0;sl.forEach(function(l){if(j.records&&j.records[l])n+=mergeList(l,j.records[l],false)});
    var oldsv=S.sv||0;
    S.cursor=j.cursor||S.cursor;S.sv=j.sv||0;
    var up=oldsv<2&&S.sv>=2;if(up)S.cursor=0;
    saveS();save();SYN.fail=0;SYN.bad=false;
    if(S.sv<1)setSy('⚠ Cần cập nhật Code.gs',true);else if(S.sv<2)setSy('☁ Đã lưu · Đầu tư và sự kiện chưa gửi');else setSy('☁ Đã lưu '+hhmm(Date.now()));
    if(n){var ae=document.activeElement;if(!(ae&&ae.tagName==='TEXTAREA'))render();else refreshAssets()}
    if(dirty()||up)schedSync(up?300:1000);
  })
  .catch(function(){
    SYN.fail++;var d=[5,15,30,60][Math.min(SYN.fail-1,3)];
    setSy('⚠ Chưa gửi được, thử lại sau '+d+' giây',true);
    clearTimeout(SYN.t);SYN.t=setTimeout(function(){doSync()},d*1000);
  })
  .then(function(){clearTimeout(to);SYN.busy=false;var p=pages[pages.length-1];if(p&&p.name==='sync'){/* giữ nguyên ô nhập */}});
}
